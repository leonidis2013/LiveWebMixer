<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>LiveWebMixer</title>
<script>
(function () {
  var p = 'dark';
  try { p = localStorage.getItem('lwm-theme') || 'dark'; } catch (e) {}
  var light = p === 'light' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151a21'/%3E%3Cpath d='M9 6v20M16 6v20M23 6v20' stroke='%23252c36' stroke-width='2'/%3E%3Crect x='6' y='16' width='6' height='5' rx='1' fill='%234c8dff'/%3E%3Crect x='13' y='9' width='6' height='5' rx='1' fill='%234c8dff'/%3E%3Crect x='20' y='19' width='6' height='5' rx='1' fill='%232ec4b6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1>LiveWebMixer <span class="ver" id="hVer"></span><small id="hSub">Mix training console</small></h1>
  <div id="status"></div>
  <div class="seg hide" id="viewSeg" title="Console layout">
    <button data-v="sq">SQ</button><button data-v="con">Console</button><button data-v="daw">DAW</button>
  </div>
  <button id="scBtn" class="hide">Scenes</button>
  <button id="midiBtn" class="hide">MIDI</button>
  <button id="themeBtn" class="gear" title="Light / dark" aria-label="Light or dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  <button id="fsBtn" class="gear" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="setupBtn" class="on hide">Setup</button>
</header>

<main id="setup"></main>

<main id="mixer" class="hide">
  <div id="tbar"></div>
  <div id="work">
    <div id="panel"></div>
    <div id="surface"></div>
  </div>
</main>

<div id="popup" class="hide"></div>
<div id="load" class="hide"><div class="card"><h2>Loading tracks</h2><div class="bar"><i id="loadBar"></i></div><div class="note" id="loadTxt"></div></div></div>
<dialog id="dlg"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
